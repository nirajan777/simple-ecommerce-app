<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🛍️ ShopHub</h1>
            <div class="nav-links">
                <a href="#" onclick="showProducts()">Shop</a>
                <a href="#" onclick="showCart()">Cart (<span id="cartCount">0</span>)</a>
                <a href="#" onclick="showOrders()">Orders</a>
                <a href="#" onclick="showAdmin()">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Products Page -->
        <section id="productsPage" class="page active">
            <h2>Available Products</h2>
            <div id="productsList" class="products-grid"></div>
        </section>

        <!-- Cart Page -->
        <section id="cartPage" class="page">
            <h2>Shopping Cart</h2>
            <div id="cartItems" class="cart-items"></div>
            <div id="cartEmpty" class="empty-message">Your cart is empty</div>
            <div id="cartSummary" class="cart-summary" style="display: none;">
                <h3>Order Summary</h3>
                <p>Total: $<span id="cartTotal">0.00</span></p>
                <button onclick="showCheckout()" class="btn btn-primary">Proceed to Checkout</button>
            </div>
        </section>

        <!-- Checkout Page -->
        <section id="checkoutPage" class="page">
            <h2>Checkout</h2>
            <form id="checkoutForm" onsubmit="submitOrder(event)" class="checkout-form">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Address *</label>
                    <input type="text" name="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" name="city" required>
                    </div>
                    <div class="form-group">
                        <label>Zip Code *</label>
                        <input type="text" name="zipCode" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select name="paymentMethod">
                        <option value="cash_on_delivery">Cash on Delivery</option>
                        <option value="credit_card">Credit Card</option>
                        <option value="online_banking">Online Banking</option>
                    </select>
                </div>
                <div class="checkout-summary">
                    <h3>Order Total: $<span id="checkoutTotal">0.00</span></h3>
                    <button type="submit" class="btn btn-success">Place Order</button>
                    <button type="button" onclick="showCart()" class="btn btn-secondary">Back to Cart</button>
                </div>
            </form>
        </section>

        <!-- Orders Page -->
        <section id="ordersPage" class="page">
            <h2>My Orders</h2>
            <div id="ordersList" class="orders-list"></div>
        </section>

        <!-- Admin Panel -->
        <section id="adminPage" class="page">
            <h2>Admin Panel</h2>
            <div class="admin-tabs">
                <button onclick="switchAdminTab('addProduct')" class="tab-btn active">Add Product</button>
                <button onclick="switchAdminTab('manageProducts')" class="tab-btn">Manage Products</button>
                <button onclick="switchAdminTab('manageOrders')" class="tab-btn">Manage Orders</button>
            </div>

            <div id="addProductTab" class="admin-tab active">
                <h3>Add New Product</h3>
                <form id="productForm" onsubmit="addProduct(event)" class="product-form">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="productDescription" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Price *</label>
                            <input type="number" id="productPrice" step="0.01" min="0" required>
                        </div>
                        <div class="form-group">
                            <label>Stock *</label>
                            <input type="number" id="productStock" min="0" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="productCategory">
                    </div>
                    <div class="form-group">
                        <label>Features (comma separated)</label>
                        <textarea id="productFeatures" placeholder="Feature 1, Feature 2, Feature 3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Product Image</label>
                        <input type="file" id="productImage" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-success">Add Product</button>
                </form>
            </div>

            <div id="manageProductsTab" class="admin-tab">
                <h3>Manage Products</h3>
                <div id="adminProductsList" class="products-grid"></div>
            </div>

            <div id="manageOrdersTab" class="admin-tab">
                <h3>Manage Orders</h3>
                <div id="adminOrdersList" class="orders-list"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 ShopHub - Simple E-Commerce for Small Business</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
